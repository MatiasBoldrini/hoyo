<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Hoyo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="danger"></div>

    <div id="loading">Armando la ciudad…</div>

    <header id="hud" hidden>
      <div id="timer">2:00</div>
      <canvas id="minimap" width="256" height="256"></canvas>
      <ol id="board"></ol>
      <p id="hint">El hoyo sigue al cursor</p>
    </header>

    <div id="toast" hidden></div>

    <section id="menu">
      <p class="eyebrow">2 minutos · el más grande gana</p>
      <h1>HOYO</h1>
      <p class="lead">Empezás chico. Tragate postes, gente y autos. Después, edificios.</p>
      <label class="field">
        <span>Tu nombre</span>
        <input id="nick" maxlength="12" autocomplete="nickname" value="Jugador" />
      </label>
      <div id="colors" class="colors"></div>
      <button id="play" type="button">JUGAR</button>
      <p class="fine">Mové el mouse: el hoyo va hacia el cursor. Cerca del hoyo, frena.</p>
    </section>

    <section id="end" hidden>
      <p id="end-kicker" class="eyebrow">Se acabó el tiempo</p>
      <h2 id="end-title">¡Sos el hoyo más grande!</h2>
      <p id="end-score"></p>
      <ol id="final"></ol>
      <button id="again" type="button">OTRA VEZ</button>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
