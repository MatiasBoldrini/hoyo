<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Hoyo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="danger"></div>

    <div id="loading">Armando la ciudad…</div>

    <header id="hud" hidden>
      <div id="timer">2:00</div>
      <canvas id="minimap" width="256" height="256"></canvas>
      <ol id="board"></ol>
      <p id="hint">El hoyo sigue al cursor · mantené el click para girar la cámara</p>
    </header>

    <div id="toast" hidden></div>

    <section id="menu">
      <h1>HOYO</h1>
      <div class="field">
        <div class="name-row">
          <button
            id="color-swatch"
            class="color-swatch"
            type="button"
            aria-label="Elegir color"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="colors"
          ></button>
          <div class="nick">
            <label for="nick">Tu nombre</label>
            <input id="nick" maxlength="12" autocomplete="nickname" placeholder="Jugador" />
          </div>
        </div>
      </div>
      <button id="play" type="button">JUGAR</button>
    </section>

    <div id="colors" class="color-pop" hidden role="dialog" aria-label="Elegir color"></div>

    <section id="end" hidden>
      <p id="end-kicker" class="eyebrow">Se acabó el tiempo</p>
      <h2 id="end-title">¡Sos el hoyo más grande!</h2>
      <p id="end-score"></p>
      <ol id="final"></ol>
      <button id="again" type="button">OTRA VEZ</button>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
